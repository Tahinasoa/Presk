<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presk — aperçu du logo</title>
<link rel="icon" href="svg/presk-icon.svg" type="image/svg+xml">
<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
  .row { display: flex; flex-wrap: wrap; }
  .panel { flex: 1 1 320px; padding: 40px; display: flex; flex-direction: column; align-items: center; gap: 28px; }
  .light { background: #ffffff; color: #101014; }
  .dark { background: #101014; color: #f2f2f2; }
  .icons { display: flex; align-items: flex-end; gap: 20px; }
  small { opacity: .6; }
</style>
</head>
<body>
<div class="row">
  <div class="panel light">
    <img src="svg/presk-logo-animated.svg" width="240" alt="Presk">
    <div class="icons"><img src="svg/presk-icon.svg" width="64" alt=""><img src="svg/presk-icon.svg" width="32" alt=""><img src="svg/presk-icon.svg" width="16" alt=""></div>
    <small>Fond clair</small>
  </div>
  <div class="panel dark">
    <img src="svg/presk-logo-animated.svg" width="240" alt="Presk">
    <div class="icons"><img src="svg/presk-icon.svg" width="64" alt=""><img src="svg/presk-icon.svg" width="32" alt=""><img src="svg/presk-icon.svg" width="16" alt=""></div>
    <small>Fond sombre</small>
  </div>
</div>
</body>
</html>
