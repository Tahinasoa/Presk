<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Presk Standalone Demo</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #0f172a;
        color: #f8fafc;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }
      .player {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 14px;
        width: min(90vw, 1100px);
      }
      #app canvas {
        display: block;
        width: 100%;
        height: auto;
        max-height: 78vh;
        object-fit: contain;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
        border-radius: 8px;
        background: #000;
      }
      .timeline-controls {
        display: grid;
        grid-template-columns: auto minmax(100px, 1fr) auto;
        align-items: center;
        gap: 14px;
        padding: 12px 14px;
        color: #f4f3ef;
        background: #202027;
        border-radius: 10px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
      }
      .playback-buttons {
        display: flex;
        gap: 8px;
      }
      .timeline-controls button {
        min-width: 64px;
        padding: 8px 12px;
        border: 1px solid #4a4a55;
        border-radius: 6px;
        color: inherit;
        background: #30303a;
        font: inherit;
        cursor: pointer;
      }
      .timeline-controls button:hover {
        background: #41414d;
      }
      .timeline-controls button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .timeline-controls button:focus-visible,
      .timeline-controls input:focus-visible {
        outline: 2px solid #a9c7ff;
        outline-offset: 3px;
      }
      .timeline-controls input[type="range"] {
        width: 100%;
        accent-color: #9bbcff;
        cursor: pointer;
      }
      .timeline-controls input[type="range"]:disabled {
        cursor: default;
      }
      .timeline-controls output {
        min-width: 112px;
        color: #c9c9d2;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      h1 {
        margin-top: 0;
        margin-bottom: 20px;
        font-size: 1.5rem;
      }
    </style>
  </head>
  <body>
    <h1>Presk Standalone Demo</h1>
    <main class="player" aria-label="Presk animation player">
      <div id="app"></div>
      <section class="timeline-controls" aria-label="Timeline controls">
        <div class="playback-buttons">
          <button id="play-button" type="button" aria-label="Play">Play</button>
          <button id="pause-button" type="button" aria-label="Pause">Pause</button>
        </div>
        <label class="sr-only" for="timeline-cursor">Timeline position</label>
        <input
          id="timeline-cursor"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="0"
          aria-label="Timeline position"
        />
        <output id="timeline-time" for="timeline-cursor">0.00 / 0.00 s</output>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
