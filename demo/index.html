<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Presk Standalone Demo</title>
    <style>
      body {
        margin: 0;
        background: #0f172a;
        color: #f8fafc;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }
      #app canvas {
        display: block;
        max-width: 100%;
        height: auto;
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }
      .controls {
        margin-top: 15px;
        display: flex;
        gap: 10px;
      }
      button {
        padding: 8px 16px;
        background: #3b82f6;
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font: inherit;
      }
      button:hover {
        background: #2563eb;
      }
    </style>
  </head>
  <body>
    <h1>Presk Standalone Demo</h1>
    <div id="app"></div>
    <div class="controls">
      <button id="play">Play</button>
      <button id="pause">Pause</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
